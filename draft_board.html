<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Board</title>
<style>:root {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --ink: #16181d;
  --muted: #6b7280;
  --line: #e3e6ea;
  --accent: #0f766e;
  --accent-soft: #ecfdf9;
  --mine: #fff8e6;
  --qb: #7c3aed; --rb: #0f766e; --wr: #b45309; --te: #be185d;
  --radius: 10px;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161a; --panel: #1c1f25; --ink: #e8eaed; --muted: #9aa3af;
    --line: #2b3038; --accent: #2dd4bf; --accent-soft: #16302e; --mine: #2a2418;
    --qb: #a78bfa; --rb: #2dd4bf; --wr: #fbbf24; --te: #f472b6;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
h2 { font-size: 12px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }

header {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 30;
}
header .sub { color: var(--muted); font-size: 12px; }
header .spacer { flex: 1; }

.wrap { max-width: 1400px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: 300px minmax(0, 1fr) 320px; align-items: start; }
/* On a phone the thing you need during a live draft is the pick entry and the
   recommendation, not the league settings you configured once before it began.
   So the single column leads with the main panel and drops setup to the end. */
@media (max-width: 1100px) {
  .wrap { grid-template-columns: 1fr; display: flex; flex-direction: column; }
  .col-main { order: 1; }
  .col-side { order: 2; }
  .col-left { order: 3; }
  .tablewrap { max-height: 420px; }
}

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.stack { display: grid; gap: 16px; }

/* status ------------------------------------------------------------------ */
.turn { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); font-weight: 600; }
.turn.mine { background: var(--accent-soft); border-color: var(--accent); }
.turn.done { color: var(--muted); }
.turn .rnd { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.turn .who { font-size: 15px; }
.turn .away { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--muted); }

/* entry ------------------------------------------------------------------- */
#entryWrap { position: relative; margin-top: 12px; }
.row { display: flex; gap: 8px; }
input[type="text"], input[type="number"], select, textarea {
  width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--ink); font: inherit;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#entry { font-size: 15px; }

#suggest { display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.14); overflow: hidden; }
#suggest.open { display: block; }
.sug { display: flex; align-items: center; gap: 9px; padding: 8px 10px; cursor: pointer; }
.sug:hover, .sug.sel { background: var(--accent-soft); }
.sug .sn { flex: 1; }
.sug .sv { font-family: var(--mono); font-size: 12px; color: var(--muted); }

button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 9px 12px; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.primary:hover { filter: brightness(1.08); }
button.mini { padding: 3px 9px; font-size: 12px; }
#btnRookie { white-space: nowrap; }
button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* position chips ---------------------------------------------------------- */
.pos { display: inline-block; min-width: 34px; text-align: center; padding: 1px 6px; border-radius: 5px; font-family: var(--mono); font-size: 11px; font-weight: 600; color: #fff; }
.pos.QB { background: var(--qb); } .pos.RB { background: var(--rb); }
.pos.WR { background: var(--wr); } .pos.TE { background: var(--te); }

/* recommendations --------------------------------------------------------- */
.rec { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 9px; }
.rec.top { border-color: var(--accent); background: var(--accent-soft); }
.rec-head { display: flex; align-items: center; gap: 9px; }
.rec-head .rank { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.rec-head .rname { font-weight: 650; flex: 1; }
.rec-nums { display: flex; gap: 14px; flex-wrap: wrap; margin: 7px 0 5px; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.rec-nums b { color: var(--ink); font-weight: 600; }
.rec-why { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
#roomRead { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); font-style: italic; }

/* board ------------------------------------------------------------------- */
.board-head { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.board-head input { flex: 1; min-width: 140px; }
.filters { display: flex; gap: 4px; }
.filters button { padding: 5px 9px; font-size: 12px; }
.tablewrap { overflow-x: auto; max-height: 620px; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { position: sticky; top: 0; background: var(--panel); text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 7px 8px; border-bottom: 1px solid var(--line); z-index: 2; }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
tbody tr:hover { background: var(--accent-soft); }
td.num { font-family: var(--mono); font-size: 12px; text-align: right; color: var(--muted); }
td.num.strong { color: var(--ink); font-weight: 600; }
td.nm { font-weight: 500; }
#boardCount { font-size: 12px; color: var(--muted); margin-left: auto; }

/* roster & log ------------------------------------------------------------ */
.rrow, .lrow { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.rrow .rn, .lrow .ln { flex: 1; }
.rrow .rp { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.lrow .lp, .lrow .lt { font-family: var(--mono); font-size: 11px; color: var(--muted); min-width: 30px; }
.lrow.mine { background: var(--mine); }
.lrow i { font-style: normal; font-size: 10px; color: var(--muted); }
#needs { margin-top: 10px; font-size: 12.5px; color: var(--accent); font-weight: 600; }
.scroll { max-height: 300px; overflow-y: auto; }
.empty { color: var(--muted); font-size: 13px; padding: 8px 0; }

/* config ------------------------------------------------------------------ */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.field { display: grid; gap: 3px; }
.field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.presets { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; }
.presets button { padding: 5px 9px; font-size: 12px; }
.li-row { font-size: 12px; color: var(--muted); margin-top: 6px; }
.li-row.repl { display: flex; gap: 10px; flex-wrap: wrap; font-family: var(--mono); }
.li-row.repl b { color: var(--ink); }
.li-row.repl i { font-style: normal; opacity: .7; }
.muted { color: var(--muted); }

/* modal ------------------------------------------------------------------- */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
.modal.open { display: flex; }
.modal-inner { background: var(--panel); border-radius: var(--radius); padding: 18px; width: min(560px, 100%); }
.modal textarea { height: 260px; font-family: var(--mono); font-size: 12px; resize: vertical; }

#flash { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: .22s; z-index: 60; }
#flash.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>Draft Board</h1>
  <span class="sub"><span id="season"></span> projections · built from <span id="dataRange"></span></span>
  <span class="spacer"></span>
  <button id="btnLog">Draft log</button>
  <button id="btnUndo">Undo</button>
  <button id="btnReset">Reset</button>
</header>

<div class="wrap">

  <!-- left: league setup -->
  <div class="stack col-left">
    <div class="panel">
      <h2>League</h2>
      <div class="presets">
        <button data-preset="std12">12 half-PPR</button>
        <button data-preset="ppr12">12 PPR</button>
        <button data-preset="ppr10">10 PPR</button>
        <button data-preset="sf12">Superflex</button>
      </div>
      <div class="grid2">
        <div class="field"><label>Teams</label><input type="number" id="cfgTeams" value="12" min="4" max="20"></div>
        <div class="field"><label>Your slot</label><input type="number" id="cfgSlot" value="11" min="1" max="20"></div>
        <div class="field"><label>Scoring</label>
          <select id="cfgScoring">
            <option value="standard">Standard</option>
            <option value="half_ppr">Half PPR</option>
            <option value="ppr" selected>Full PPR</option>
          </select>
        </div>
        <div class="field"><label>Order</label>
          <select id="cfgSnake"><option value="snake" selected>Snake</option><option value="linear">Linear</option></select>
        </div>
        <div class="field"><label>QB</label><input type="number" id="cfgQB" value="1" min="0" max="3"></div>
        <div class="field"><label>RB</label><input type="number" id="cfgRB" value="2" min="0" max="5"></div>
        <div class="field"><label>WR</label><input type="number" id="cfgWR" value="2" min="0" max="6"></div>
        <div class="field"><label>TE</label><input type="number" id="cfgTE" value="1" min="0" max="3"></div>
        <div class="field"><label>Flex</label><input type="number" id="cfgFLEX" value="1" min="0" max="4"></div>
        <div class="field"><label>Superflex</label><input type="number" id="cfgSF" value="0" min="0" max="2"></div>
        <div class="field"><label>Bench</label><input type="number" id="cfgBench" value="6" min="0" max="15"></div>
        <div class="field"><label>TE bonus/rec</label><input type="number" id="cfgTEP" value="0" step="0.5" min="0" max="2"></div>
      </div>
      <div id="leagueInfo"></div>
    </div>

    <div class="panel">
      <h2>Your roster</h2>
      <div id="rosterBody"></div>
      <div id="needs"></div>
    </div>
  </div>

  <!-- middle: entry + recommendations + board -->
  <div class="stack col-main">
    <div class="panel">
      <div id="status"></div>
      <div id="entryWrap">
        <div class="row">
          <input type="text" id="entry" placeholder="Type a name and press Enter to record the pick…" autocomplete="off" spellcheck="false">
          <button id="btnRookie" title="Record a player with no NFL history">Add rookie</button>
        </div>
        <div id="suggest"></div>
      </div>
      <div class="btnrow">
        <button id="btnRec" class="primary">Recommend</button>
        <div class="field" style="margin-left:auto"><label>Sims</label><input type="number" id="cfgSims" value="120" min="20" max="600" step="20" style="width:90px"></div>
      </div>
    </div>

    <div class="panel">
      <h2>Recommendation</h2>
      <div id="recBody"></div>
      <div id="roomRead"></div>
    </div>

    <div class="panel">
      <h2>Available</h2>
      <div class="board-head">
        <input type="text" id="boardSearch" placeholder="Search board…" autocomplete="off">
        <div class="filters">
          <button data-posfilter="" class="on">All</button>
          <button data-posfilter="QB">QB</button>
          <button data-posfilter="RB">RB</button>
          <button data-posfilter="WR">WR</button>
          <button data-posfilter="TE">TE</button>
        </div>
        <span id="boardCount"></span>
      </div>
      <div class="tablewrap">
        <table>
          <thead><tr><th>#</th><th>Player</th><th>Pos</th><th>Tier</th><th>Proj</th><th>VOR</th><th></th></tr></thead>
          <tbody id="boardBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- right: pick log -->
  <div class="stack col-side">
    <div class="panel">
      <h2>Picks</h2>
      <div id="logBody" class="scroll"></div>
    </div>
  </div>

</div>

<div class="modal" id="logModal">
  <div class="modal-inner">
    <h2>Draft log</h2>
    <p class="muted" style="font-size:12.5px;margin-top:0">One name per line, in pick order. Copy this to save your draft, or paste a log in and press Load to restore it. Rookies are stored as <code>*Name|POS</code>.</p>
    <textarea id="logText" spellcheck="false"></textarea>
    <div class="btnrow">
      <button id="btnLogCopy">Copy</button>
      <button id="btnLogLoad" class="primary">Load</button>
      <span style="flex:1"></span>
      <button id="btnLogClose">Close</button>
    </div>
  </div>
</div>

<script>// ---------------------------------------------------------------------------
// ffopt engine, ported from the Python package.
//
// Everything the Python version does at draft time happens here: scoring a
// projected stat line under the league's rules, deriving replacement levels
// from the roster shape, adaptive opponent modelling, and Monte Carlo over the
// remaining draft.
//
// Projections themselves are NOT recomputed here -- the fitted stat lines are
// baked into the page. But scoring is, which is what keeps the board honest
// when you change the league: switching to PPR genuinely reshuffles it.
// ---------------------------------------------------------------------------

const FFOPT = (() => {
  'use strict';

  const POSITIONS = ['QB', 'RB', 'WR', 'TE'];

  // -- scoring --------------------------------------------------------------

  function basePoints(reception) {
    return {
      passing_yards: 0.04, passing_tds: 4, interceptions: -2,
      passing_2pt_conversions: 2,
      rushing_yards: 0.1, rushing_tds: 6, rushing_2pt_conversions: 2,
      receptions: reception, receiving_yards: 0.1, receiving_tds: 6,
      receiving_2pt_conversions: 2,
      fumbles_lost: -2, special_teams_tds: 6,
    };
  }

  const PRESETS = {
    standard: basePoints(0),
    half_ppr: basePoints(0.5),
    ppr: basePoints(1),
  };

  function scoreLine(line, rules) {
    if (!line) return 0;
    let total = 0;
    for (const stat in rules) total += rules[stat] * (line[stat] || 0);
    return total;
  }

  // Position-conditional scoring, so a TE premium applies only to tight ends.
  function rulesFor(league, pos) {
    const rules = Object.assign({}, league.scoring);
    if (pos === 'TE' && league.tePremium) {
      rules.receptions = (rules.receptions || 0) + league.tePremium;
    }
    return rules;
  }

  // -- league ---------------------------------------------------------------

  function makeLeague(cfg) {
    const slots = [];
    const add = (name, eligible, count) => {
      if (count > 0) slots.push({ name, eligible, count });
    };
    add('QB', ['QB'], cfg.qb);
    add('RB', ['RB'], cfg.rb);
    add('WR', ['WR'], cfg.wr);
    add('TE', ['TE'], cfg.te);
    add('FLEX', ['RB', 'WR', 'TE'], cfg.flex);
    add('SUPERFLEX', ['QB', 'RB', 'WR', 'TE'], cfg.superflex);

    const starters = slots.reduce((n, s) => n + s.count, 0);
    return {
      teams: cfg.teams,
      bench: cfg.bench,
      scoring: typeof cfg.scoring === 'string' ? PRESETS[cfg.scoring] : cfg.scoring,
      tePremium: cfg.tePremium || 0,
      starters: slots,
      nStarters: starters,
      rosterSize: starters + cfg.bench,
      totalPicks: (starters + cfg.bench) * cfg.teams,
      positions: POSITIONS,
      snake: cfg.snake !== false,
    };
  }

  const dedicatedFor = (league, pos) =>
    league.starters.filter((s) => s.eligible.length === 1 && s.eligible[0] === pos)
      .reduce((n, s) => n + s.count, 0);

  const flexSlotsFor = (league, pos) =>
    league.starters.filter((s) => s.eligible.length > 1 && s.eligible.includes(pos))
      .reduce((n, s) => n + s.count, 0);

  const capacityFor = (league, pos) =>
    league.starters.filter((s) => s.eligible.includes(pos))
      .reduce((n, s) => n + s.count, 0);

  // -- the board ------------------------------------------------------------

  // Blend the fitted projection with last season's actual points, exactly as
  // ProjectionModel does. Both halves are scored under the *current* league,
  // which is what keeps this league-agnostic rather than re-ranking a frozen
  // list of points.
  function buildBoard(players, league, blend) {
    const scored = [];
    for (const p of players) {
      const rules = rulesFor(league, p.pos);
      const model = scoreLine(p.s, rules);
      let points = model;
      if (p.p && p.pg >= 1) {
        points = blend * model + (1 - blend) * scoreLine(p.p, rules);
      }
      if (points < 1) continue;
      scored.push({
        id: p.id, name: p.name, pos: p.pos, team: p.team, age: p.age,
        games: p.g, points, modelPoints: model,
      });
    }

    scored.sort((a, b) => b.points - a.points);
    const flexShares = empiricalFlexShares(scored, league);
    const replacement = replacementLevels(scored, league, flexShares);

    for (const row of scored) {
      row.replacement = replacement[row.pos] || 0;
      row.vor = row.points - row.replacement;
    }
    scored.sort((a, b) => b.vor - a.vor);

    const posCount = {};
    scored.forEach((row, i) => {
      row.overallRank = i + 1;
      posCount[row.pos] = (posCount[row.pos] || 0) + 1;
      row.posRank = posCount[row.pos];
    });

    assignTiers(scored);
    return { players: scored, league, replacement, flexShares };
  }

  // Which positions actually win the multi-position slots? Rather than assume,
  // fill every team's lineup greedily from the board and count.
  function empiricalFlexShares(scored, league) {
    const flexSlots = league.starters.filter((s) => s.eligible.length > 1);
    const totalFlex = flexSlots.reduce((n, s) => n + s.count, 0) * league.teams;
    if (!totalFlex) return {};

    const dedicated = {}, flexLeft = {}, counts = {};
    for (const pos of league.positions) {
      dedicated[pos] = dedicatedFor(league, pos) * league.teams;
      counts[pos] = 0;
    }
    for (const s of flexSlots) flexLeft[s.name] = s.count * league.teams;

    const byPoints = scored.slice().sort((a, b) => b.points - a.points);
    for (const row of byPoints) {
      if (dedicated[row.pos] > 0) { dedicated[row.pos] -= 1; continue; }
      for (const s of flexSlots) {
        if (s.eligible.includes(row.pos) && flexLeft[s.name] > 0) {
          flexLeft[s.name] -= 1;
          counts[row.pos] += 1;
          break;
        }
      }
    }
    const shares = {};
    for (const pos in counts) shares[pos] = counts[pos] / totalFlex;
    return shares;
  }

  function replacementRank(league, pos, flexShare) {
    const dedicated = dedicatedFor(league, pos) * league.teams;
    const flex = flexSlotsFor(league, pos) * league.teams;
    const share = flexShare === undefined
      ? ({ RB: 0.45, WR: 0.45, TE: 0.1, QB: 0.9 }[pos] || 0)
      : flexShare;
    return Math.max(1, Math.round(dedicated + flex * share));
  }

  function replacementLevels(scored, league, flexShares) {
    const levels = {};
    for (const pos of league.positions) {
      const pool = scored.filter((r) => r.pos === pos)
        .map((r) => r.points).sort((a, b) => b - a);
      if (!pool.length) { levels[pos] = 0; continue; }
      const rank = replacementRank(league, pos, flexShares[pos]);
      // Average a window around the cutoff so one outlier at the boundary
      // does not swing the whole position.
      const lo = Math.max(0, rank - 2), hi = Math.min(pool.length, rank + 3);
      const slice = pool.slice(lo, hi);
      levels[pos] = slice.length
        ? slice.reduce((a, b) => a + b, 0) / slice.length
        : pool[pool.length - 1];
    }
    return levels;
  }

  // Tier breaks sit where the drop to the next player is unusually large for
  // that position. Tiers turn a ranking into a decision.
  function assignTiers(scored, gapMultiplier = 0.8, maxTiers = 12) {
    for (const pos of POSITIONS) {
      const block = scored.filter((r) => r.pos === pos)
        .sort((a, b) => b.points - a.points);
      if (block.length <= 1) { block.forEach((r) => (r.tier = 1)); continue; }

      const gaps = [];
      for (let i = 1; i < block.length; i++) gaps.push(block[i - 1].points - block[i].points);
      const mean = gaps.reduce((a, b) => a + b, 0) / gaps.length;
      const sd = Math.sqrt(gaps.reduce((a, g) => a + (g - mean) ** 2, 0) / gaps.length);
      const threshold = mean + gapMultiplier * sd;

      let tier = 1;
      block[0].tier = 1;
      for (let i = 1; i < block.length; i++) {
        if (gaps[i - 1] >= threshold && tier < maxTiers) tier += 1;
        block[i].tier = tier;
      }
    }
  }

  // -- draft state ----------------------------------------------------------

  function pickOrder(league) {
    const order = [];
    for (let r = 0; r < league.rosterSize; r++) {
      for (let t = 0; t < league.teams; t++) {
        order.push(league.snake && r % 2 === 1 ? league.teams - 1 - t : t);
      }
    }
    return order;
  }

  // Open starting slots, filled greedily: dedicated first, then flexes.
  function openSlots(league, positions) {
    const remaining = {};
    for (const s of league.starters) remaining[s.name] = s.count;
    const pool = positions.slice();

    for (const pass of [1, 2]) {
      for (const s of league.starters) {
        const isFlex = s.eligible.length > 1;
        if ((pass === 1) === isFlex) continue;
        for (let i = pool.length - 1; i >= 0; i--) {
          if (remaining[s.name] <= 0) break;
          if (s.eligible.includes(pool[i])) {
            remaining[s.name] -= 1;
            pool.splice(i, 1);
          }
        }
      }
    }
    return remaining;
  }

  function starterNeed(league, positions, pos) {
    const open = openSlots(league, positions);
    return league.starters
      .filter((s) => s.eligible.includes(pos))
      .reduce((n, s) => n + (open[s.name] || 0), 0);
  }

  // -- opponent model -------------------------------------------------------
  //
  // Not an ADP assumption. It starts from a value-shaped prior and re-fits from
  // the picks actually seen: for each position it compares how often it has
  // really gone against how often value alone predicted, weighted toward recent
  // picks. A run registers within a pick or two, and fades if it was a blip.

  function makeOpponents(league, opts = {}) {
    return {
      league,
      temperature: opts.temperature || 4.0,
      driftDecay: 0.93,
      driftSmoothing: 4.0,
      driftCap: 3.5,
      needWeight: 1.6,
      depthTolerance: 2,
      observed: {},
      expected: {},
      seen: 0,
    };
  }

  function observe(model, pos, expectedProbs) {
    const d = model.driftDecay;
    const keys = new Set([
      ...Object.keys(model.observed), ...Object.keys(model.expected),
      ...Object.keys(expectedProbs), pos,
    ]);
    for (const k of keys) {
      model.observed[k] = (model.observed[k] || 0) * d;
      model.expected[k] = (model.expected[k] || 0) * d;
    }
    model.observed[pos] = (model.observed[pos] || 0) + 1;
    for (const p in expectedProbs) model.expected[p] = (model.expected[p] || 0) + expectedProbs[p];
    model.seen += 1;
  }

  function driftMultipliers(model) {
    const out = {}, a = model.driftSmoothing, cap = model.driftCap;
    for (const pos of model.league.positions) {
      const m = ((model.observed[pos] || 0) + a) / ((model.expected[pos] || 0) + a);
      out[pos] = Math.min(cap, Math.max(1 / cap, m));
    }
    return out;
  }

  function cloneOpponents(model) {
    const c = makeOpponents(model.league, { temperature: model.temperature });
    c.observed = Object.assign({}, model.observed);
    c.expected = Object.assign({}, model.expected);
    c.seen = model.seen;
    return c;
  }

  function needMultipliers(model, counts, picksLeft) {
    const league = model.league, out = {};
    const open = {};
    let surplus = 0, flexTotal = 0;
    for (const s of league.starters) if (s.eligible.length > 1) flexTotal += s.count;

    for (const pos of league.positions) {
      const ded = dedicatedFor(league, pos);
      open[pos] = Math.max(ded - (counts[pos] || 0), 0);
      if (flexSlotsFor(league, pos) > 0) surplus += Math.max((counts[pos] || 0) - ded, 0);
    }
    const openFlex = Math.max(flexTotal - surplus, 0);

    for (const pos of league.positions) {
      const need = open[pos] + (flexSlotsFor(league, pos) > 0 ? openFlex : 0);
      let m = 1;
      if (picksLeft > 0 && need > 0) {
        m = 1 + model.needWeight * Math.min(1, need / Math.max(picksLeft, 1));
      }
      const limit = capacityFor(league, pos) + model.depthTolerance;
      const held = counts[pos] || 0;
      if (held >= limit) m *= 0.04;
      else if (held === limit - 1) m *= 0.4;
      out[pos] = m;
    }
    return out;
  }

  // Softmax over board rank, tilted by drift and roster need.
  function pickProbs(model, pool, counts, picksLeft, drift) {
    const need = needMultipliers(model, counts, picksLeft);
    const logits = new Float64Array(pool.length);
    let max = -Infinity;
    for (let i = 0; i < pool.length; i++) {
      const pos = pool[i].pos;
      const adj = (drift[pos] || 1) * (need[pos] || 1);
      logits[i] = -i / model.temperature + Math.log(Math.max(adj, 1e-9));
      if (logits[i] > max) max = logits[i];
    }
    let sum = 0;
    for (let i = 0; i < pool.length; i++) { logits[i] = Math.exp(logits[i] - max); sum += logits[i]; }
    for (let i = 0; i < pool.length; i++) logits[i] /= sum || 1;
    return logits;
  }

  // -- simulation -----------------------------------------------------------

  // Seeded RNG so candidates can be compared under identical opponent
  // behaviour (common random numbers). Without pairing, the noise between runs
  // swamps the real differences, which are small.
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function sample(probs, rand) {
    let r = rand(), acc = 0;
    for (let i = 0; i < probs.length; i++) { acc += probs[i]; if (r <= acc) return i; }
    return probs.length - 1;
  }

  // Best startable lineup. Bench players contribute nothing: their worth is
  // insurance, already priced into games-played discounting.
  function lineupValue(league, picks, valueOf) {
    const sorted = picks.slice().sort((a, b) => valueOf(b) - valueOf(a));
    const used = new Array(sorted.length).fill(false);
    const slots = league.starters.slice().sort((a, b) => a.eligible.length - b.eligible.length);
    let total = 0;
    for (const s of slots) {
      let filled = 0;
      for (let i = 0; i < sorted.length && filled < s.count; i++) {
        if (used[i] || !s.eligible.includes(sorted[i].pos)) continue;
        used[i] = true; total += valueOf(sorted[i]); filled += 1;
      }
    }
    return total;
  }

  const POOL_SIZE = 60;

  function lineupFull(league, counts) {
    let surplus = 0, flexTotal = 0;
    for (const s of league.starters) if (s.eligible.length > 1) flexTotal += s.count;
    for (const pos of league.positions) {
      const ded = dedicatedFor(league, pos);
      if ((counts[pos] || 0) < ded) return false;
      if (flexSlotsFor(league, pos) > 0) surplus += Math.max((counts[pos] || 0) - ded, 0);
    }
    return surplus >= flexTotal;
  }

  // One draft played forward. Returns my lineup value and who survived.
  function runDraft(ctx, forcedId, rand, stopAt) {
    const { board, league, state } = ctx;
    const taken = new Set(state.picks.map((p) => p.id));
    const avail = board.players.filter((p) => !taken.has(p.id));

    const counts = {};
    for (let t = 0; t < league.teams; t++) counts[t] = {};
    const rosters = {};
    for (let t = 0; t < league.teams; t++) rosters[t] = [];
    for (const p of state.picks) {
      counts[p.team][p.pos] = (counts[p.team][p.pos] || 0) + 1;
      rosters[p.team].push(p);
    }

    const opponents = cloneOpponents(ctx.opponents);
    const order = ctx.order;
    let pickNo = state.picks.length;
    const limit = stopAt === undefined ? order.length : stopAt;
    let forcedUsed = forcedId === null;

    while (pickNo < limit && avail.length) {
      const team = order[pickNo];
      const pool = avail.slice(0, POOL_SIZE);
      let slot;

      if (team === state.mySlot && !forcedUsed) {
        slot = avail.findIndex((p) => p.id === forcedId);
        if (slot < 0) break;
        forcedUsed = true;
      } else if (team === state.mySlot) {
        // I keep drafting sensibly: best value, discounted once a position is
        // already well covered.
        let best = 0, bestScore = -Infinity;
        for (let i = 0; i < pool.length; i++) {
          let v = pool[i].vor;
          if ((counts[team][pool[i].pos] || 0) >= capacityFor(league, pool[i].pos) + 1) v *= 0.15;
          if (v > bestScore) { bestScore = v; best = i; }
        }
        slot = best;
      } else {
        const picksLeft = league.rosterSize - (rosters[team].length);
        const drift = driftMultipliers(opponents);
        const probs = pickProbs(opponents, pool, counts[team], picksLeft, drift);
        slot = sample(probs, rand);
        const expected = {};
        for (let i = 0; i < pool.length; i++) {
          expected[pool[i].pos] = (expected[pool[i].pos] || 0) + probs[i];
        }
        observe(opponents, pool[slot].pos, expected);
      }

      const chosen = avail[slot];
      avail.splice(slot, 1);
      counts[team][chosen.pos] = (counts[team][chosen.pos] || 0) + 1;
      rosters[team].push(chosen);
      pickNo += 1;

      // Once my lineup can be fielded, nothing later changes its value. Exact,
      // not an approximation -- and it removes the back half of every run.
      if (team === state.mySlot && stopAt === undefined && lineupFull(league, counts[team])) break;
    }

    return {
      value: lineupValue(league, rosters[state.mySlot], (p) => p.vor || 0),
      survivors: new Set(avail.map((p) => p.id)),
    };
  }

  function nextPickFor(order, team, after) {
    for (let i = after; i < order.length; i++) if (order[i] === team) return i;
    return null;
  }

  function survivalProbabilities(ctx, nSims) {
    const { order, state, board } = ctx;
    const taken = new Set(state.picks.map((p) => p.id));
    const counts = new Map();
    // Seed every available player at zero. A player who is taken in *every*
    // simulation never lands in the survivor set at all, so without this an
    // absent key is indistinguishable from "not simulated" -- and the top
    // player on the board would report 100% survival instead of 0%.
    for (const p of board.players) if (!taken.has(p.id)) counts.set(p.id, 0);

    const target = nextPickFor(order, state.mySlot, state.picks.length + 1);
    if (target === null) {
      for (const k of counts.keys()) counts.set(k, 1);
      return counts;
    }

    for (let i = 0; i < nSims; i++) {
      const { survivors } = runDraft(ctx, null, mulberry32(1000 + i), target);
      for (const id of survivors) {
        if (counts.has(id)) counts.set(id, counts.get(id) + 1);
      }
    }
    for (const [k, v] of counts) counts.set(k, v / nSims);
    return counts;
  }

  function evaluate(ctx, candidates, nSims) {
    const out = new Map();
    for (const cand of candidates) {
      let total = 0;
      for (let i = 0; i < nSims; i++) {
        // Same seed per simulation index across every candidate: the only
        // thing that differs between them is my own pick.
        total += runDraft(ctx, cand.id, mulberry32(7000 + i), undefined).value;
      }
      out.set(cand.id, total / nSims);
    }
    return out;
  }

  // -- recommendations ------------------------------------------------------

  function usable(league, avail, myPositions) {
    const counts = {};
    for (const pos of myPositions) counts[pos] = (counts[pos] || 0) + 1;
    const blocked = new Set(
      league.positions.filter((p) => (counts[p] || 0) >= capacityFor(league, p) + 1)
    );
    if (!blocked.size) return avail;
    const kept = avail.filter((p) => !blocked.has(p.pos));
    return kept.length ? kept : avail;
  }

  function shortlist(league, avail, n) {
    const top = avail.slice(0, Math.max(n - league.positions.length, 3));
    const seen = new Set(top.map((p) => p.id));
    for (const pos of league.positions) {
      const best = avail.find((p) => p.pos === pos);
      if (best && !seen.has(best.id)) { top.push(best); seen.add(best.id); }
    }
    return top.slice(0, n);
  }

  function explain(ctx, row, survival, avail) {
    const { league, state } = ctx;
    const reasons = [];
    const sameTier = avail.filter((p) => p.pos === row.pos && p.tier === row.tier);

    if (sameTier.length <= 1) reasons.push(`last ${row.pos} in tier ${row.tier}`);
    else if (sameTier.length <= 3) reasons.push(`only ${sameTier.length} left in this ${row.pos} tier`);

    if (survival < 0.25) reasons.push(`almost certainly gone by your next pick (${Math.round(survival * 100)}% survival)`);
    else if (survival > 0.7) reasons.push(`likely still there next turn (${Math.round(survival * 100)}%) — you can wait`);

    const mine = state.picks.filter((p) => p.team === state.mySlot).map((p) => p.pos);
    if (mine.length >= league.nStarters - 3) {
      const open = openSlots(league, mine);
      const dedicated = league.starters
        .filter((s) => s.eligible.length === 1 && s.eligible[0] === row.pos)
        .reduce((n, s) => n + (open[s.name] || 0), 0);
      const sharedNames = league.starters
        .filter((s) => s.eligible.length > 1 && s.eligible.includes(row.pos) && (open[s.name] || 0) > 0)
        .map((s) => s.name);
      if (dedicated > 0) reasons.push(`you still need ${dedicated} starting ${row.pos}`);
      else if (sharedNames.length) reasons.push(`would fill your open ${sharedNames.join('/')}`);
    }

    const drift = driftMultipliers(ctx.opponents)[row.pos] || 1;
    if (drift >= 1.4) reasons.push(`${row.pos} run under way (${drift.toFixed(1)}x normal pace)`);
    else if (drift <= 0.7) reasons.push(`${row.pos}s are sliding in this room`);

    if (!reasons.length) reasons.push(`best value on the board (${Math.round(row.vor)} over replacement)`);
    return reasons.join('; ');
  }

  function recommend(ctx, opts = {}) {
    const n = opts.n || 5;
    const nSims = opts.sims || 120;
    const survivalSims = opts.survivalSims || 200;

    const taken = new Set(ctx.state.picks.map((p) => p.id));
    const avail = ctx.board.players.filter((p) => !taken.has(p.id));
    if (!avail.length) return [];

    const survival = survivalProbabilities(ctx, survivalSims);
    const myPositions = ctx.state.picks
      .filter((p) => p.team === ctx.state.mySlot).map((p) => p.pos);
    const cands = shortlist(ctx.league, usable(ctx.league, avail, myPositions), opts.candidates || 12);
    const values = evaluate(ctx, cands, nSims);

    let best = -Infinity;
    for (const v of values.values()) if (v > best) best = v;

    const out = cands.map((row) => {
      const surv = survival.has(row.id) ? survival.get(row.id) : 0;
      return {
        ...row,
        survival: surv,
        rosterValue: values.get(row.id),
        edge: values.get(row.id) - best,
        reason: explain(ctx, row, surv, avail),
      };
    });
    out.sort((a, b) => b.rosterValue - a.rosterValue);
    return out.slice(0, n);
  }

  function roomRead(model) {
    if (!model.seen) return 'No picks observed yet; using the value-based prior.';
    const drift = driftMultipliers(model);
    const parts = [];
    for (const pos of Object.keys(drift).sort((a, b) => drift[b] - drift[a])) {
      if (drift[pos] >= 1.25) parts.push(`${pos} going ${drift[pos].toFixed(1)}x faster than value implies`);
      else if (drift[pos] <= 0.8) parts.push(`${pos} sliding (${drift[pos].toFixed(1)}x)`);
    }
    return parts.length ? parts.join('; ')
      : 'The room is drafting close to value; no strong positional drift.';
  }

  // How disciplined is this room? Fit from where on the board picks came from.
  function fitTemperature(board, pickIds) {
    if (pickIds.length < 8) return 4.0;
    const order = new Map(board.players.map((p, i) => [p.id, i]));
    const ranks = [];
    const taken = new Set();
    for (const id of pickIds) {
      if (!order.has(id)) continue;
      const abs = order.get(id);
      let ahead = 0;
      for (const t of taken) if ((order.get(t) ?? 1e9) < abs) ahead += 1;
      ranks.push(abs - ahead);
      taken.add(id);
    }
    if (!ranks.length) return 4.0;

    let best = 4.0, bestLL = -Infinity;
    for (const temp of [1.5, 2.5, 4.0, 6.0, 9.0, 14.0]) {
      let norm = 0;
      for (let i = 0; i < board.players.length; i++) norm += Math.exp(-i / temp);
      const logNorm = Math.log(norm);
      let ll = 0;
      for (const r of ranks) ll += -r / temp - logNorm;
      if (ll > bestLL) { bestLL = ll; best = temp; }
    }
    return best;
  }

  return {
    PRESETS, POSITIONS, makeLeague, buildBoard, pickOrder, openSlots, starterNeed,
    makeOpponents, observe, driftMultipliers, pickProbs, cloneOpponents,
    recommend, roomRead, fitTemperature, lineupValue, capacityFor,
    replacementRank, nextPickFor,
  };
})();
</script>
<script>(() => {

  const state = {

      qb: 1, rb: 2, wr: 2, te: 1, flex: 1, superflex: 0,
      tePremium: 0, snake: true,
    },
    mySlot: 10,          // zero-based
    picks: [],           // {id, name, pos, team, rookie?}
    league: null,
    board: null,
    order: null,
    opponents: null,
    recs: null,
    busy: false,
  };

  // -- setup ----------------------------------------------------------------

  function readConfig() {
    const num = (id, fallback) => {
      const v = parseInt($(id).value, 10);
      return Number.isFinite(v) ? v : fallback;
    };
    state.cfg = {
      teams: num('cfgTeams', 12),
      bench: num('cfgBench', 6),
      qb: num('cfgQB', 1), rb: num('cfgRB', 2), wr: num('cfgWR', 2),
      te: num('cfgTE', 1), flex: num('cfgFLEX', 1), superflex: num('cfgSF', 0),
      scoring: $('cfgScoring').value,
      tePremium: parseFloat($('cfgTEP').value) || 0,
      snake: $('cfgSnake').value === 'snake',
    };
    const slot = num('cfgSlot', 1);
    state.mySlot = Math.min(Math.max(slot, 1), state.cfg.teams) - 1;
    $('cfgSlot').value = state.mySlot + 1;
  }

  function rebuild() {
    readConfig();
    state.league = FFOPT.makeLeague(state.cfg);
    state.board = FFOPT.buildBoard(DATA.players, state.league, DATA.blend);
    state.order = FFOPT.pickOrder(state.league);

    // Replay every pick so the opponent model sees the draft as it unfolded.
    state.opponents = FFOPT.makeOpponents(state.league);
    const byId = new Map(state.board.players.map((p) => [p.id, p]));
    const replay = [];
    for (const pick of state.picks) {
      const taken = new Set(replay.map((p) => p.id));
      const avail = state.board.players.filter((p) => !taken.has(p.id));
      const team = state.order[replay.length];
      const counts = {};
      for (const p of replay) if (p.team === team) counts[p.pos] = (counts[p.pos] || 0) + 1;
      const picksLeft = state.league.rosterSize - replay.filter((p) => p.team === team).length;
      const pool = avail.slice(0, 60);
      const probs = FFOPT.pickProbs(
        state.opponents, pool, counts, picksLeft, FFOPT.driftMultipliers(state.opponents)
      );
      const expected = {};
      for (let i = 0; i < pool.length; i++) expected[pool[i].pos] = (expected[pool[i].pos] || 0) + probs[i];
      FFOPT.observe(state.opponents, pick.pos, expected);
      replay.push(pick);
    }

    const realIds = state.picks.filter((p) => !p.rookie).map((p) => p.id);
    if (realIds.length >= 8) {
      state.opponents.temperature = FFOPT.fitTemperature(state.board, realIds);
    }

    // Keep pick metadata in sync with the current scoring.
    for (const pick of state.picks) {
      const row = byId.get(pick.id);
      if (row) { pick.pos = row.pos; pick.name = row.name; }
    }
    state.recs = null;
    render();
  }

  // -- draft mechanics ------------------------------------------------------

  const teamOnClock = () => state.order[state.picks.length];
  const isMyTurn = () => teamOnClock() === state.mySlot;
  const complete = () => state.picks.length >= state.league.totalPicks;

  function roundSlot(n) {
    return [Math.floor(n / state.league.teams) + 1, (n % state.league.teams) + 1];
  }

  function recordPick(row, rookie) {
    if (complete()) return;
    state.picks.push({
      id: row.id, name: row.name, pos: row.pos,
      team: teamOnClock(), rookie: !!rookie,
    });
    rebuild();
  }

  function undo() {
    if (!state.picks.length) return;
    state.picks.pop();
    rebuild();
  }

  // -- rendering ------------------------------------------------------------

  function render() {
    renderStatus();
    renderBoard();
    renderRoster();
    renderLog();
    renderRecs();
    renderLeagueInfo();
  }

  function renderStatus() {
    const box = $('status');
    if (complete()) {
      box.innerHTML = '<div class="turn done">Draft complete</div>';
      return;
    }
    const team = teamOnClock();
    const [rnd, slot] = roundSlot(state.picks.length);
    const mine = team === state.mySlot;
    const nextMine = FFOPT.nextPickFor(state.order, state.mySlot, state.picks.length);
    const away = nextMine === null ? null : nextMine - state.picks.length;

    box.innerHTML = `
      <div class="turn ${mine ? 'mine' : ''}">
        <span class="rnd">${rnd}.${String(slot).padStart(2, '0')}</span>
        <span class="who">${mine ? 'Your pick' : 'Team ' + (team + 1)}</span>
        ${!mine && away !== null ? `<span class="away">your turn in ${away}</span>` : ''}
      </div>`;
  }

  function renderLeagueInfo() {
    const b = state.board;
    const parts = state.league.starters
      .map((s) => (s.count > 1 ? `${s.count}×${s.name}` : s.name)).join(', ');
    const repl = FFOPT.POSITIONS.map((p) => {
      const rank = FFOPT.replacementRank(state.league, p, b.flexShares[p]);
      return `<span><b>${p}</b> ${b.replacement[p].toFixed(0)} <i>(${rank}th)</i></span>`;
    }).join('');
    const flex = Object.entries(b.flexShares)
      .filter(([, v]) => v > 0.01)
      .sort((a, b2) => b2[1] - a[1])
      .map(([p, v]) => `${p} ${Math.round(v * 100)}%`).join(', ');

    $('leagueInfo').innerHTML = `
      <div class="li-row">${state.league.teams} teams · ${parts} · ${state.league.bench} bench</div>
      <div class="li-row repl">Replacement level: ${repl}</div>
      ${flex ? `<div class="li-row muted">Flex slots go to ${flex}</div>` : ''}`;
  }

  let boardFilter = '';
  let boardPos = '';

  function renderBoard() {
    const taken = new Set(state.picks.map((p) => p.id));
    let rows = state.board.players.filter((p) => !taken.has(p.id));
    if (boardPos) rows = rows.filter((p) => p.pos === boardPos);
    if (boardFilter) {
      const q = boardFilter.toLowerCase();
      rows = rows.filter((p) => p.name.toLowerCase().includes(q));
    }
    const shown = rows.slice(0, 60);

    $('boardBody').innerHTML = shown.map((p) => `
      <tr data-id="${p.id}">
        <td class="num">${p.overallRank}</td>
        <td class="nm">${p.name}</td>
        <td><span class="pos ${p.pos}">${p.pos}${p.posRank}</span></td>
        <td class="num">${p.tier}</td>
        <td class="num">${p.points.toFixed(0)}</td>
        <td class="num strong">${p.vor.toFixed(0)}</td>
        <td><button class="mini" data-pick="${p.id}">draft</button></td>
      </tr>`).join('');

    $('boardCount').textContent = `${rows.length} available`;
  }

  function renderRoster() {
    const mine = state.picks.filter((p) => p.team === state.mySlot);
    const byId = new Map(state.board.players.map((p) => [p.id, p]));
    if (!mine.length) {
      $('rosterBody').innerHTML = '<div class="empty">No picks yet</div>';
    } else {
      $('rosterBody').innerHTML = mine.map((p) => {
        const row = byId.get(p.id);
        return `<div class="rrow">
          <span class="pos ${p.pos}">${p.pos}</span>
          <span class="rn">${p.name}</span>
          <span class="rp">${row ? row.points.toFixed(0) : '—'}</span>
        </div>`;
      }).join('');
    }
    const open = FFOPT.openSlots(state.league, mine.map((p) => p.pos));
    const needs = Object.entries(open).filter(([, v]) => v > 0)
      .map(([k, v]) => (v > 1 ? `${v}×${k}` : k)).join(', ');
    $('needs').textContent = needs ? `Still needs: ${needs}` : 'Starting lineup is full';
  }

  function renderLog() {
    if (!state.picks.length) {
      $('logBody').innerHTML = '<div class="empty">No picks recorded</div>';
      return;
    }
    $('logBody').innerHTML = state.picks.map((p, i) => {
      const [r, s] = roundSlot(i);
      const mine = p.team === state.mySlot;
      return `<div class="lrow ${mine ? 'mine' : ''}">
        <span class="lp">${r}.${String(s).padStart(2, '0')}</span>
        <span class="lt">${mine ? 'YOU' : 'T' + (p.team + 1)}</span>
        <span class="pos ${p.pos}">${p.pos}</span>
        <span class="ln">${p.name}${p.rookie ? ' <i>rookie</i>' : ''}</span>
      </div>`;
    }).reverse().join('');
  }

  function renderRecs() {
    const box = $('recBody');
    if (complete()) { box.innerHTML = '<div class="empty">Draft complete</div>'; return; }
    if (state.busy) { box.innerHTML = '<div class="empty">Simulating…</div>'; return; }
    if (!isMyTurn()) {
      box.innerHTML = '<div class="empty">Record picks until your turn, or press <b>Recommend</b> to look ahead.</div>';
      return;
    }
    if (!state.recs) { box.innerHTML = '<div class="empty">Press <b>Recommend</b>.</div>'; return; }

    box.innerHTML = state.recs.map((r, i) => `
      <div class="rec ${i === 0 ? 'top' : ''}">
        <div class="rec-head">
          <span class="rank">${i + 1}</span>
          <span class="rname">${r.name}</span>
          <span class="pos ${r.pos}">${r.pos}${r.posRank}</span>
          <button class="mini" data-pick="${r.id}">draft</button>
        </div>
        <div class="rec-nums">
          <span>proj <b>${r.points.toFixed(0)}</b></span>
          <span>VOR <b>${r.vor.toFixed(0)}</b></span>
          <span>survives <b>${Math.round(r.survival * 100)}%</b></span>
          <span>edge <b>${r.edge >= 0 ? '+' : ''}${r.edge.toFixed(1)}</b></span>
        </div>
        <div class="rec-why">${r.reason}</div>
      </div>`).join('');
    $('roomRead').textContent = FFOPT.roomRead(state.opponents);
  }

  function runRecommend() {
    state.busy = true;
    renderRecs();
    // Yield so the "Simulating…" paint lands before the main thread blocks.
    setTimeout(() => {
      const ctx = {
        board: state.board, league: state.league, order: state.order,
        opponents: state.opponents,
        state: { picks: state.picks, mySlot: state.mySlot },
      };
      state.recs = FFOPT.recommend(ctx, {
        n: 5,
        sims: parseInt($('cfgSims').value, 10) || 120,
        survivalSims: 200,
      });
      state.busy = false;
      renderRecs();
      $('roomRead').textContent = FFOPT.roomRead(state.opponents);
    }, 20);
  }

  // -- quick entry ----------------------------------------------------------

  // Draft rooms call picks by surname — "Chase!", "Nacua!" — so a surname hit
  // has to outrank a first-name hit. Prefix-matching alone answers "chase" with
  // Chase Brown rather than Ja'Marr Chase, which is exactly the kind of mistake
  // that is hard to notice and expensive to undo. Within each tier of match
  // quality, the more valuable player comes first, since that is overwhelmingly
  // the one being called out.
  function matches(query) {
    const q = query.trim().toLowerCase();
    if (!q) return [];
    const taken = new Set(state.picks.map((p) => p.id));
    const avail = state.board.players.filter((p) => !taken.has(p.id));

    const exact = avail.filter((p) => p.name.toLowerCase() === q);
    if (exact.length === 1) return exact;

    const norm = (s) => s.toLowerCase().replace(/[.'’]/g, '');
    const nq = norm(q);
    const rank = (p) => {
      const name = norm(p.name);
      const parts = name.split(/\s+/);
      const surname = parts.length > 1 ? parts.slice(1).join(' ') : parts[0];
      if (name === nq) return 0;
      if (surname === nq) return 1;
      if (surname.startsWith(nq)) return 2;
      if (name.startsWith(nq)) return 3;
      if (parts.some((part) => part.startsWith(nq))) return 4;
      if (name.includes(nq)) return 5;
      return 99;
    };

    return avail
      .map((p) => ({ p, r: rank(p) }))
      .filter((x) => x.r < 99)
      .sort((a, b) => (a.r - b.r) || (b.p.vor - a.p.vor))
      .slice(0, 8)
      .map((x) => x.p);
  }

  let suggestList = [];

  function renderSuggest(list) {
    suggestList = list;
    const box = $('suggest');
    if (!list.length) { box.innerHTML = ''; box.classList.remove('open'); return; }
    if (suggestIndex >= list.length) suggestIndex = 0;
    box.classList.add('open');
    box.innerHTML = list.map((p, i) => `
      <div class="sug ${i === suggestIndex ? 'sel' : ''}" data-pick="${p.id}">
        <span class="pos ${p.pos}">${p.pos}${p.posRank}</span>
        <span class="sn">${p.name}</span>
        <span class="sv">${p.vor.toFixed(0)}</span>
      </div>`).join('');
  }

  let suggestIndex = 0;

  function submitEntry() {
    const input = $('entry');
    const list = matches(input.value);
    if (!list.length) {
      flash('No match — use “Add rookie” for a player with no NFL history.');
      return;
    }
    const chosen = list[Math.min(suggestIndex, list.length - 1)];
    recordPick(chosen, false);
    // Say what was actually recorded. A mis-matched name is easy to miss and
    // expensive to find later, and Undo is one key away.
    flash(`Recorded ${chosen.name} (${chosen.pos}) — press Undo if that's wrong`);
    input.value = '';
    suggestIndex = 0;
    renderSuggest([]);
    input.focus();
  }

  function flash(message) {
    const el = $('flash');
    el.textContent = message;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 3200);
  }

  // -- draft log import / export -------------------------------------------
  //
  // Deliberately not browser storage: a plain text log can be copied between
  // devices, pasted back after a refresh, and read by a human.

  function exportLog() {
    return state.picks.map((p) => (p.rookie ? `*${p.name}|${p.pos}` : p.name)).join('\n');
  }

  function importLog(text) {
    state.picks = [];
    rebuild();
    const lines = text.split('\n').map((l) => l.trim()).filter(Boolean);
    let failed = 0;
    for (const line of lines) {
      if (line.startsWith('*')) {
        const [name, pos] = line.slice(1).split('|');
        recordRookieDirect(name, (pos || 'RB').toUpperCase());
        continue;
      }
      const list = matches(line);
      if (!list.length) { failed += 1; continue; }
      state.picks.push({
        id: list[0].id, name: list[0].name, pos: list[0].pos,
        team: state.order[state.picks.length], rookie: false,
      });
    }
    rebuild();
    flash(failed ? `Loaded, ${failed} name(s) not recognised` : `Loaded ${state.picks.length} picks`);
  }

  function recordRookieDirect(name, pos) {
    state.picks.push({
      id: `rookie:${name.toLowerCase().replace(/\s+/g, '_')}:${state.picks.length}`,
      name, pos, team: state.order[state.picks.length], rookie: true,
    });
  }

  // -- wiring ---------------------------------------------------------------

  function init() {
    $('season').textContent = DATA.season;
    $('dataRange').textContent = DATA.generated_from;

    ['cfgTeams', 'cfgBench', 'cfgQB', 'cfgRB', 'cfgWR', 'cfgTE', 'cfgFLEX',
      'cfgSF', 'cfgScoring', 'cfgTEP', 'cfgSlot', 'cfgSnake'].forEach((id) => {
      $(id).addEventListener('change', () => {
        // Changing the roster shape mid-draft would invalidate the pick order.
        if (state.picks.length && ['cfgTeams', 'cfgSnake'].includes(id)) {
          if (!confirm('Changing team count or draft type resets the draft. Continue?')) {
            rebuild(); return;
          }
          state.picks = [];
        }
        rebuild();
      });
    });

    $('entry').addEventListener('input', (e) => {
      suggestIndex = 0;
      renderSuggest(matches(e.target.value));
    });
    $('entry').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submitEntry(); return; }
      if (e.key === 'Escape') { renderSuggest([]); return; }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        if (!suggestList.length) return;
        e.preventDefault();
        suggestIndex = (suggestIndex + (e.key === 'ArrowDown' ? 1 : -1) + suggestList.length)
          % suggestList.length;
        renderSuggest(suggestList);
      }
    });

    document.body.addEventListener('click', (e) => {
      const pickBtn = e.target.closest('[data-pick]');
      if (pickBtn) {
        const id = pickBtn.getAttribute('data-pick');
        const row = state.board.players.find((p) => p.id === id);
        if (row) {
          recordPick(row, false);
          $('entry').value = '';
          renderSuggest([]);
        }
        return;
      }
      if (!e.target.closest('#entryWrap')) renderSuggest([]);
    });

    $('btnRec').addEventListener('click', runRecommend);
    $('btnUndo').addEventListener('click', undo);
    $('btnReset').addEventListener('click', () => {
      if (state.picks.length && !confirm('Clear all picks?')) return;
      state.picks = []; rebuild();
    });

    $('btnRookie').addEventListener('click', () => {
      const name = $('entry').value.trim();
      if (!name) { flash('Type the name first, then press Add rookie.'); return; }
      const pos = prompt(`Position for ${name}? (QB, RB, WR, TE)`, 'RB');
      if (!pos) return;
      const clean = pos.trim().toUpperCase();
      if (!FFOPT.POSITIONS.includes(clean)) { flash('Position must be QB, RB, WR or TE.'); return; }
      recordRookieDirect(name, clean);
      $('entry').value = '';
      renderSuggest([]);
      rebuild();
    });

    $('boardSearch').addEventListener('input', (e) => { boardFilter = e.target.value; renderBoard(); });
    document.querySelectorAll('[data-posfilter]').forEach((btn) => {
      btn.addEventListener('click', () => {
        boardPos = btn.getAttribute('data-posfilter');
        document.querySelectorAll('[data-posfilter]').forEach((b) => b.classList.remove('on'));
        btn.classList.add('on');
        renderBoard();
      });
    });

    $('btnLog').addEventListener('click', () => {
      $('logText').value = exportLog();
      $('logModal').classList.add('open');
    });
    $('btnLogClose').addEventListener('click', () => $('logModal').classList.remove('open'));
    $('btnLogLoad').addEventListener('click', () => {
      importLog($('logText').value);
      $('logModal').classList.remove('open');
    });
    $('btnLogCopy').addEventListener('click', () => {
      $('logText').select();
      try { document.execCommand('copy'); flash('Copied'); } catch (err) { flash('Select and copy manually'); }
    });

    document.querySelectorAll('[data-preset]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const preset = btn.getAttribute('data-preset');
        const map = {
          std12: { teams: 12, scoring: 'half_ppr', sf: 0 },
          ppr12: { teams: 12, scoring: 'ppr', sf: 0 },
          ppr10: { teams: 10, scoring: 'ppr', sf: 0 },
          sf12: { teams: 12, scoring: 'half_ppr', sf: 1 },
        }[preset];
        if (!map) return;
        if (state.picks.length && !confirm('Switching preset resets the draft. Continue?')) return;
        state.picks = [];
        $('cfgTeams').value = map.teams;
        $('cfgScoring').value = map.scoring;
        $('cfgSF').value = map.sf;
        rebuild();
      });
    });

    rebuild();
    $('entry').focus();
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
